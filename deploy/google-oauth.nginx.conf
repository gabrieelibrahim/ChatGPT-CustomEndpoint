# Include inside the HTTPS server block for sakelar.web.id, before generic routes.
# OAuth callback URLs contain authorization codes: do not log these routes.
location ^~ /__google/ {
    access_log off;
    # Cloudflare Tunnel is the only trusted source of CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    proxy_pass http://127.0.0.1:1431;
    proxy_http_version 1.1;
    proxy_set_header Host sakelar.web.id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    client_max_body_size 16k;
}
